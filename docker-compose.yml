services:

  qdrant:
    image: qdrant/qdrant
    container_name: flexroute-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  ollama:
    image: ollama/ollama
    container_name: flexroute-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  backend:
    build: .
    container_name: flexroute-api
    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      OLLAMA_URL: http://ollama:11434
      QDRANT_URL: http://qdrant:6333

    volumes:
      - ./checkpoints.sqlite:/app/checkpoints.sqlite

    depends_on:
      - qdrant
      - ollama

volumes:
  qdrant_data:
  ollama_data: